<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Cloud Publisher</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 40px 20px; }
        h1 { color: #00a2ff; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background-color: #00a2ff; color: #fff; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #0082cc; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Roblox Cloud Publisher</h1>
        <p>Publique seus projetos Roblox diretamente pela nuvem sem precisar do Studio.</p>
        <button onclick="alert('Login em breve!')">Entrar com Roblox</button>
    </div>
</body>
</html>
